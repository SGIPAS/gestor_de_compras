<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestor de Compras - AMV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .active-tab { border-bottom: 2px solid #3b82f6; color: #3b82f6; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen font-sans">
    <div id="app" class="max-w-5xl mx-auto p-4">
        <!-- Login -->
        <div id="login-section" class="flex items-center justify-center min-h-screen">
            <div class="bg-white p-8 rounded-xl shadow-md border border-gray-200 w-full max-w-md">
                <div class="text-center mb-6">
                    <div class="text-4xl mb-2">🛒</div>
                    <h1 class="text-2xl font-bold text-gray-800">Gestor de Compras</h1>
                    <p class="text-sm text-gray-500">Inicie sesión para continuar</p>
                </div>
                <form id="login-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Email</label>
                        <input type="email" id="login-email" class="w-full border border-gray-300 rounded-lg p-2.5 text-gray-800 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Contraseña</label>
                        <input type="password" id="login-password" class="w-full border border-gray-300 rounded-lg p-2.5 text-gray-800 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none" required>
                    </div>
                    <p id="login-error" class="text-red-500 text-sm hidden"></p>
                    <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2.5 rounded-lg transition-colors">Iniciar Sesión</button>
                </form>
                <p class="text-sm text-gray-500 text-center mt-4">¿No tiene cuenta? <a href="#" id="btn-registro" class="text-blue-600 hover:underline">Registrarse</a></p>
            </div>
        </div>

        <!-- Panel principal (oculto hasta login) -->
        <div id="main-section" class="hidden">
            <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <div class="flex items-center gap-3">
                    <span class="text-3xl">🛒</span>
                    <h1 class="text-2xl font-bold text-gray-800">Gestor de Compras</h1>
                </div>
                <button id="btn-logout" class="bg-red-100 hover:bg-red-200 text-red-600 py-1.5 px-4 rounded-lg text-sm font-medium transition-colors">Salir</button>
            </div>

            <!-- Pestañas -->
            <div class="border-b border-gray-200 mb-6 bg-white rounded-t-xl shadow-sm">
                <nav class="flex space-x-1 px-4">
                    <button data-tab="nueva" class="tab-btn active-tab py-3 px-4 text-sm font-medium">➕ Nueva Orden</button>
                    <button data-tab="lista" class="tab-btn text-gray-500 hover:text-gray-800 py-3 px-4 text-sm font-medium">📋 Lista</button>
                    <button data-tab="proveedores" class="tab-btn text-gray-500 hover:text-gray-800 py-3 px-4 text-sm font-medium">🏭 Proveedores</button>
                    <button data-tab="resumen" class="tab-btn text-gray-500 hover:text-gray-800 py-3 px-4 text-sm font-medium">📊 Resumen</button>
                </nav>
            </div>

            <div id="tab-content"></div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
