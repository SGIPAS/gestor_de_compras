<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestor de Compras - AMV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .active-tab { border-bottom: 2px solid #3b82f6; color: #3b82f6; }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen font-sans">
    <div id="app" class="max-w-4xl mx-auto p-4">
        <!-- Login -->
        <div id="login-section" class="flex items-center justify-center min-h-screen">
            <div class="bg-slate-800 p-8 rounded-lg shadow-xl w-full max-w-md">
                <h1 class="text-2xl font-bold text-white text-center mb-6">Gestor de Compras</h1>
                <form id="login-form" class="space-y-4">
                    <div>
                        <label class="block text-sm text-slate-400">Email</label>
                        <input type="email" id="login-email" class="w-full bg-slate-700 border border-slate-600 rounded p-2 text-white" required>
                    </div>
                    <div>
                        <label class="block text-sm text-slate-400">Contraseña</label>
                        <input type="password" id="login-password" class="w-full bg-slate-700 border border-slate-600 rounded p-2 text-white" required>
                    </div>
                    <p id="login-error" class="text-red-400 text-sm hidden"></p>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded">Iniciar Sesión</button>
                </form>
                <p class="text-sm text-slate-400 text-center mt-4">O <a href="#" id="btn-registro" class="text-blue-400 hover:underline">registrarse</a></p>
            </div>
        </div>

        <!-- Panel principal (oculto hasta login) -->
        <div id="main-section" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold text-white">Gestor de Compras</h1>
                <button id="btn-logout" class="bg-red-600 hover:bg-red-700 text-white py-1 px-3 rounded text-sm">Salir</button>
            </div>

            <!-- Pestañas -->
            <div class="border-b border-slate-700 mb-4">
                <nav class="flex space-x-4">
                    <button data-tab="nueva" class="tab-btn active-tab py-2 px-3 text-sm font-medium">➕ Nueva Orden</button>
                    <button data-tab="lista" class="tab-btn text-slate-400 hover:text-white py-2 px-3 text-sm font-medium">📋 Lista</button>
                    <button data-tab="proveedores" class="tab-btn text-slate-400 hover:text-white py-2 px-3 text-sm font-medium">🏭 Proveedores</button>
                    <button data-tab="resumen" class="tab-btn text-slate-400 hover:text-white py-2 px-3 text-sm font-medium">📊 Resumen</button>
                </nav>
            </div>

            <div id="tab-content"></div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
